name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  plugin-ci:
    name: Moodle 5.1 / PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB: mariadb
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: ""
      DB_NAME: moodle
      MOODLE_BRANCH: MOODLE_501_STABLE
      MOODLE_DIR: ${{ github.workspace }}/moodle
      PLUGIN_DIR: ${{ github.workspace }}/plugin

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "${GITHUB_WORKSPACE}/ci/bin" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/ci/vendor/bin" >> "${GITHUB_PATH}"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle test site
        run: >
          moodle-plugin-ci install
          --moodle="${MOODLE_DIR}"
          --data="${GITHUB_WORKSPACE}/moodledata"
          --plugin="${PLUGIN_DIR}"
          --db-host="${DB_HOST}"
          --no-plugin-node

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint "${PLUGIN_DIR}"

      - name: Validate plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate --moodle="${MOODLE_DIR}" "${PLUGIN_DIR}"

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints "${PLUGIN_DIR}"

      - name: Moodle coding standard
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings=0 "${PLUGIN_DIR}"

      - name: PHPDoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --moodle="${MOODLE_DIR}" --max-warnings=0 "${PLUGIN_DIR}"

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache "${MOODLE_DIR}/public/mod/groupassign"

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --moodle="${MOODLE_DIR}" --testdox --fail-on-warning --fail-on-deprecation "${PLUGIN_DIR}"
